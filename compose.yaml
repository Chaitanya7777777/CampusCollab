name: campuscollab
services:
  mailpit:
    image: axllent/mailpit:v1.27.4
    environment:
      # Docker bridge reverse-DNS can exceed bounded SMTP delivery timeouts.
      MP_SMTP_DISABLE_RDNS: "true"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: campuscollab
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: campuscollab
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuscollab -d campuscollab"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres-test:
    profiles: ["test"]
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: campuscollab_test
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: campuscollab_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuscollab_test -d campuscollab_test"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
